# docker-compose.yml — Meeting Transcriber web UI
#
# Запуск:     docker compose up --build
# Остановка:  Ctrl+C  (или docker compose down)
# Браузер:    http://localhost:8080

services:
  meeting-transcriber:
    build: .
    image: meeting-transcriber
    # Override ENTRYPOINT — запускаем Flask вместо entrypoint.sh
    entrypoint: ["python", "/app/app.py"]
    ports:
      # Хост-порт можно сменить в .env: APP_PORT=8081 (если 8080 занят)
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./input:/input
      - ./output:/output
      - ./inbox:/inbox
      - ./processed:/processed
      - ./failed:/failed
      - ./logs:/logs
      # Obsidian Vault — путь задаётся в .env через OBSIDIAN_VAULT_PATH
      - ${OBSIDIAN_VAULT_PATH:-./obsidian_vault}:/vault
      # Кэш моделей HuggingFace — сохраняется между перезапусками
      - hf_cache:/root/.cache/huggingface
      # Состояние приложения (SQLite) — named volume, не bind-mount:
      # SQLite поверх виндового bind-mount ловит проблемы блокировок (ADR-002).
      # Бэкапы автоматически падают в ./output/backups/ — они видны на хосте.
      - app_data:/data
    environment:
      - TZ=${TZ:-Europe/Moscow}
    env_file: .env
    # Позволяет Flask-серверу обращаться к LLM, запущенному на хосте
    # (нужно если LLM_BASE_URL=http://localhost:XXXX)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # GPU-блок вынесен в docker-compose.gpu.yml: с ним compose ТРЕБУЕТ
    # nvidia-runtime и не стартует на CPU-сервере. На машинах с GPU
    # start.bat подключает оба файла автоматически.

volumes:
  hf_cache:
  app_data:

