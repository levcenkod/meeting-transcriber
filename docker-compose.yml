# docker-compose.yml — Meeting Transcriber web UI
#
# Запуск:     docker compose up --build
# Остановка:  Ctrl+C  (или docker compose down)
# Браузер:    http://localhost:8080

services:
  meeting-transcriber:
    build: .
    image: meeting-transcriber
    # Override ENTRYPOINT — запускаем Flask вместо entrypoint.sh
    entrypoint: ["python", "/app/app.py"]
    ports:
      # ТОЛЬКО loopback: Docker публикует порты В ОБХОД ufw (свои iptables-
      # правила), поэтому "8080:8080" открывает приложение всему интернету
      # даже при включённом файрволе. Наружу отдаём через tailscale serve.
      # Хост-порт можно сменить в .env: APP_PORT=8081 (если 8080 занят).
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - ./input:/input
      - ./output:/output
      - ./inbox:/inbox
      - ./processed:/processed
      - ./failed:/failed
      - ./logs:/logs
      # Кэш моделей HuggingFace — сохраняется между перезапусками
      - hf_cache:/root/.cache/huggingface
      # Состояние приложения (SQLite) — named volume, не bind-mount:
      # SQLite поверх виндового bind-mount ловит проблемы блокировок (ADR-002).
      # Бэкапы автоматически падают в ./output/backups/ — они видны на хосте.
      - app_data:/data
    environment:
      - TZ=${TZ:-Europe/Moscow}
    env_file: .env
    # Позволяет Flask-серверу обращаться к LLM, запущенному на хосте
    # (нужно если LLM_BASE_URL=http://localhost:XXXX)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # GPU-блок вынесен в docker-compose.gpu.yml: с ним compose ТРЕБУЕТ
    # nvidia-runtime и не стартует на CPU-сервере. На машинах с GPU
    # start.bat подключает оба файла автоматически.

  # Телеграм-воронка: принимает войсы/аудио от разрешённых отправителей
  # и кладёт в inbox/. Только исходящие запросы — портов не открывает.
  # Без TELEGRAM_BOT_TOKEN тихо спит, лишним не будет ни на одной машине.
  tg-ingest:
    image: meeting-transcriber
    entrypoint: ["python", "/scripts/tg_ingest.py"]
    volumes:
      - ./inbox:/inbox
    environment:
      - TZ=${TZ:-Europe/Moscow}
    env_file: .env
    restart: unless-stopped
    depends_on:
      - meeting-transcriber

volumes:
  hf_cache:
  app_data:

